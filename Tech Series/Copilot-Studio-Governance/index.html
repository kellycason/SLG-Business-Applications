<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Videos about Copilot Studio governance.">
  <title>Copilot Studio Governance Video Series</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }
    header {
      padding: 72px 0 48px;
      border-bottom: 1px solid var(--cp-border);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--cp-accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2.25rem, 5vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
    }
    .intro {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--cp-text-muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
    }
    main { padding: 48px 0 72px; }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    h2 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    .count {
      color: var(--cp-text-soft);
      font-size: 0.9rem;
    }
    .video-card {
      overflow: hidden;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .thumbnail-link {
      position: relative;
      display: block;
      background: var(--cp-surface-soft);
    }
    .thumbnail-link img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      border: 2px solid var(--cp-accent-fg);
      border-radius: 50%;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      transform: translate(-50%, -50%);
      transition: background-color 160ms ease, transform 160ms ease;
    }
    .play svg {
      width: 24px;
      height: 24px;
      margin-left: 3px;
      fill: currentColor;
    }
    .thumbnail-link:hover .play {
      background: var(--cp-accent-hover);
      transform: translate(-50%, -50%) scale(1.06);
    }
    .card-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px;
    }
    .part {
      margin: 0 0 5px;
      color: var(--cp-text-soft);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h3 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      line-height: 1.2;
    }
    .watch-link {
      flex: 0 0 auto;
      padding: 10px 16px;
      border-radius: 0.625rem;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease;
    }
    .watch-link:hover { background: var(--cp-accent-hover); }
    a:focus-visible {
      outline: 3px solid var(--cp-link);
      outline-offset: 3px;
    }
    footer {
      padding: 28px 0;
      border-top: 1px solid var(--cp-border);
      color: var(--cp-text-muted);
      font-size: 0.9rem;
    }
    footer p { margin: 0; }
    @media (max-width: 640px) {
      .shell { width: min(100% - 24px, 1120px); }
      header { padding: 48px 0 36px; }
      main { padding: 36px 0 56px; }
      .card-content { align-items: stretch; flex-direction: column; gap: 18px; padding: 20px; }
      .watch-link { text-align: center; }
      .play { width: 54px; height: 54px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .play, .watch-link { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <p class="eyebrow">Governance video series</p>
      <h1>Copilot Studio Governance</h1>
      <p class="intro">Videos about Copilot Studio governance.</p>
    </div>
  </header>

  <main class="shell">
    <section aria-labelledby="videos-heading">
      <div class="section-heading">
        <h2 id="videos-heading">Videos</h2>
        <span class="count">1 video</span>
      </div>

      <article class="video-card">
        <a class="thumbnail-link" href="https://youtu.be/28aQUkd2KXk" target="_blank" rel="noopener noreferrer" aria-label="Watch Part 01: Tenant Settings and DLP Policies on YouTube">
          <img src="assets/part-01-tenant-settings-dlp-policies.svg" alt="Part 01 — Tenant Settings and DLP Policies">
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </a>
        <div class="card-content">
          <div>
            <p class="part">Part 01</p>
            <h3>Tenant Settings &amp; DLP Policies</h3>
          </div>
          <a class="watch-link" href="https://youtu.be/28aQUkd2KXk" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <div class="shell">
      <p>Copilot Studio Governance Video Series</p>
    </div>
  </footer>
</body>
</html>
